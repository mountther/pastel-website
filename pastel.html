<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>راسم الباستيل الزيتي - Oil Pastel Painter</title>
  <style>
    body {
      background-color: #18181b;
      color: #f4f4f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      color: #fbbf24;
    }
    .controls {
      background: #27272a;
      padding: 15px 25px;
      border-radius: 12px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    input[type="file"] {
      color: #e4e4e7;
    }
    button {
      background: #f59e0b;
      color: #18181b;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    button:hover {
      background: #fbbf24;
    }
    .window-frame {
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid #52525b;
    }
    .window-header {
      background: #f3f4f6;
      color: #1f2937;
      padding: 6px 12px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      direction: ltr;
      border-bottom: 1px solid #e5e7eb;
    }
    canvas {
      display: block;
      background-color: #111111;
      max-width: 90vw;
      max-height: 75vh;
    }
    #status {
      margin-top: 10px;
      color: #a1a1aa;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h1>🎨 محول الصور إلى لوحة Oil Pastel</h1>

  <div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <button id="startBtn">إعادة الرسم</button>
  </div>

  <div class="window-frame">
    <div class="window-header">
      <span>🖌️ Oil Pastel</span>
      <span>—  □  ✕</span>
    </div>
    <canvas id="paintCanvas" width="600" height="720"></canvas>
  </div>

  <div id="status">اختر صورة من جهازك لبدء الرسم التدريجي...</div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const imageInput = document.getElementById('imageInput');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('status');

    let sourceImg = new Image();
    let animationId = null;
    let imgData = null;
    let angles = null;

    // إنشاء صورة افتراضية (باقة ورد ملونة) في حال لم يرفع المستخدم صورة بعد
    function createDefaultImage() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 600;
      tempCanvas.height = 720;
      const tCtx = tempCanvas.getContext('2d');

      // خلفية أوراق شجر خضراء
      tCtx.fillStyle = '#2d4c1e';
      tCtx.fillRect(0, 0, 600, 720);
      for (let i = 0; i < 300; i++) {
        tCtx.fillStyle = ['#1e3a12', '#3f6a28', '#588135', '#769f48', '#14260b'][i % 5];
        tCtx.beginPath();
        tCtx.arc(Math.random() * 600, Math.random() * 720, 15 + Math.random() * 35, 0, Math.PI * 2);
        tCtx.fill();
      }

      // الغلاف البني للباقة
      tCtx.fillStyle = '#3e2723';
      tCtx.beginPath();
      tCtx.moveTo(110, 260);
      tCtx.lineTo(490, 260);
      tCtx.lineTo(350, 560);
      tCtx.lineTo(250, 560);
      tCtx.closePath();
      tCtx.fill();

      // ساق الباقة
      tCtx.fillRect(260, 540, 80, 160);

      // الأيدي والملابس الزرقاء
      tCtx.fillStyle = '#1e88e5';
      tCtx.beginPath();
      tCtx.moveTo(0, 720);
      tCtx.lineTo(230, 570);
      tCtx.lineTo(260, 650);
      tCtx.lineTo(120, 720);
      tCtx.fill();

      tCtx.beginPath();
      tCtx.moveTo(600, 720);
      tCtx.lineTo(370, 590);
      tCtx.lineTo(340, 660);
      tCtx.lineTo(480, 720);
      tCtx.fill();

      tCtx.fillStyle = '#e0ac69';
      tCtx.beginPath();
      tCtx.arc(245, 585, 32, 0, Math.PI * 2);
      tCtx.arc(355, 610, 32, 0, Math.PI * 2);
      tCtx.fill();

      // ورود الباقة الملونة
      const flowerColors = ['#ff8da1', '#ffd166', '#70d6ff', '#ffffff', '#ff70a6', '#c77dff', '#ff9770', '#a8dadc'];
      for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * 135;
        const fx = 300 + Math.cos(angle) * r * 1.15;
        const fy = 315 + Math.sin(angle) * r * 0.9;
        tCtx.fillStyle = flowerColors[Math.floor(Math.random() * flowerColors.length)];
        tCtx.beginPath();
        tCtx.arc(fx, fy, 10 + Math.random() * 18, 0, Math.PI * 2);
        tCtx.fill();
      }

      sourceImg.src = tempCanvas.toDataURL();
    }

    // حساب زوايا الحواف (Gradient Orientation) لتوجيه الفرشاة مثل كود البايثون
    function computeGradients(w, h, data) {
      const lum = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const idx = i * 4;
        lum[i] = (0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2]) / 255;
      }

      const ang = new Float32Array(w * h);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const gx = lum[y * w + (x + 1)] - lum[y * w + (x - 1)];
          const gy = lum[(y + 1) * w + x] - lum[(y - 1) * w + x];
          ang[y * w + x] = Math.atan2(gy, gx) + Math.PI / 2;
        }
      }
      return ang;
    }

    // دالة رسم ضربة فرشاة باستيل خشن (Textured Oil Pastel Stroke)
    function drawPastelStroke(x, y, radius, angle, r, g, b) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle + (Math.random() - 0.5) * 0.35);

      const length = radius * 2.4;
      const width = radius * 1.1;

      // رسم حبيبات الباستيل لمحاكاة ملمس الورق الخشن
      const bristles = Math.max(6, Math.floor(radius * 1.3));
      for (let i = 0; i < bristles; i++) {
        const ox = (Math.random() - 0.5) * length;
        const oy = (Math.random() - 0.5) * width;
        const grainW = radius * (0.45 + Math.random() * 0.5);
        const grainH = radius * (0.25 + Math.random() * 0.35);

        // تنويع طفيف بالإضاءة لإعطاء ملمس زيتي حقيقي
        const delta = (Math.random() - 0.5) * 18;
        const cr = Math.min(255, Math.max(0, Math.round(r + delta)));
        const cg = Math.min(255, Math.max(0, Math.round(g + delta)));
        const cb = Math.min(255, Math.max(0, Math.round(b + delta)));

        ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, 0.85)`;
        ctx.beginPath();
        ctx.ellipse(ox, oy, grainW, grainH, (Math.random() - 0.5) * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function startPainting() {
      if (animationId) cancelAnimationFrame(animationId);

      // ضبط أبعاد اللوحة
      const maxW = 600;
      const maxH = 720;
      let w = sourceImg.width;
      let h = sourceImg.height;
      const ratio = Math.min(maxW / w, maxH / h);
      w = Math.round(w * ratio);
      h = Math.round(h * ratio);

      canvas.width = w;
      canvas.height = h;

      // قراءة بيانات الصورة الأصلية
      const offCanvas = document.createElement('canvas');
      offCanvas.width = w;
      offCanvas.height = h;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(sourceImg, 0, 0, w, h);
      imgData = offCtx.getImageData(0, 0, w, h).data;
      angles = computeGradients(w, h, imgData);

      // مسح اللوحة باللون الداكن في البداية كما في الفيديو
      ctx.fillStyle = '#0f0f10';
      ctx.fillRect(0, 0, w, h);

      // طبقات الرسم: من الفرشاة الكبيرة جداً إلى التفاصيل الدقيقة
      const layers = [
        { radius: 28, count: 280, speed: 12, name: 'الطبقة الأساسية (ضربات عريضة)' },
        { radius: 18, count: 650, speed: 25, name: 'الطبقة المتوسطة (تشكيل الملامح)' },
        { radius: 10, count: 1600, speed: 55, name: 'طبقة التفاصيل الأولية' },
        { radius: 6,  count: 3500, speed: 110, name: 'طبقة التفاصيل الدقيقة' },
        { radius: 3,  count: 6000, speed: 180, name: 'اللمسات النهائية (Oil Pastel)' }
      ];

      let currentLayer = 0;
      let strokesDone = 0;

      function renderStep() {
        if (currentLayer >= layers.length) {
          statusText.textContent = '✨ اكتملت اللوحة الفنية!';
          return;
        }

        const layer = layers[currentLayer];
        statusText.textContent = `جاري الرسم: ${layer.name}...`;

        const curCanvasData = ctx.getImageData(0, 0, w, h).data;

        for (let i = 0; i < layer.speed && strokesDone < layer.count; i++) {
          // اختيار نقطة تحتاج إلى تعديل لوني (Error-driven sampling)
          let bestX = Math.floor(Math.random() * w);
          let bestY = Math.floor(Math.random() * h);
          let maxErr = -1;

          for (let sample = 0; sample < 5; sample++) {
            const sx = Math.floor(Math.random() * w);
            const sy = Math.floor(Math.random() * h);
            const idx = (sy * w + sx) * 4;
            const err = Math.abs(imgData[idx] - curCanvasData[idx]) +
                        Math.abs(imgData[idx+1] - curCanvasData[idx+1]) +
                        Math.abs(imgData[idx+2] - curCanvasData[idx+2]);
            if (err > maxErr) {
              maxErr = err;
              bestX = sx;
              bestY = sy;
            }
          }

          const pIdx = (bestY * w + bestX) * 4;
          const r = imgData[pIdx];
          const g = imgData[pIdx + 1];
          const b = imgData[pIdx + 2];
          const angle = angles[bestY * w + bestX];

          drawPastelStroke(bestX, bestY, layer.radius, angle, r, g, b);
          strokesDone++;
        }

        if (strokesDone >= layer.count) {
          currentLayer++;
          strokesDone = 0;
        }

        animationId = requestAnimationFrame(renderStep);
      }

      renderStep();
    }

    sourceImg.onload = startPainting;

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          sourceImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    startBtn.addEventListener('click', () => {
      if (sourceImg.src) startPainting();
    });

    createDefaultImage();
  </script>
</body>
</html>
